            });
            if (response.ok) audienceRegistered = !!active;
        } catch (_) {} finally {clearTimeout(timeout); audienceBusy = false;}
    }
    window.addEventListener('message', function (event) {
        if (!frame || event.source !== frame.contentWindow || event.origin !== window.location.origin) return;
        if (event.data === 'zenix_playback_started') { audiencePaused = false; setTimeout(audiencePing, 0); }
        if (event.data === 'zenix_embed_paused') { audiencePaused = true; setTimeout(audiencePing, 0); }
    });
    function scheduleAudiencePing() {
        audienceTimer = setTimeout(function () { audiencePing(); scheduleAudiencePing(); }, 42000 + Math.random() * 6000);
    }
    setTimeout(audiencePing, 5000);
    scheduleAudiencePing();
    window.addEventListener('pagehide', function () {
        clearTimeout(audienceTimer);
        if (!audienceRegistered) return;
        try { navigator.sendBeacon('/api/embed-audience/heartbeat', new Blob([JSON.stringify({sid: SID, token: audienceToken, active: false})], {type:'application/json'})); } catch (_) {}
    });
    window.addEventListener('pageshow', function (event) {
        if (event.persisted) { audienceLastSent = 0; audienceRegistered = false; clearTimeout(audienceTimer); audiencePing(); scheduleAudiencePing(); }
    });

    if (V2 && v2Locked) {
        const v2Gate=document.getElementById('zx-v2-gate'),v2Button=document.getElementById('zx-v2-open'),v2Status=document.getElementById('zx-v2-status');
        const v2Open="";
        let v2Poll=null,v2Busy=false,v2Deadline=0,v2Opened=0,v2Required=1,v2Expected=0;
        const v2Copy=document.getElementById('zx-v2-copy');
        function showV2Progress(){
            v2Button.textContent=v2Required===2?(v2Opened===0?'Ouvrir la publicité · 1 / 2':'Dernière publicité · 2 / 2'):'Lire maintenant ↗';
            if(v2Copy)v2Copy.textContent=v2Required===2?'Deux ouvertures avant cette séance. Fermez chaque publicité, puis revenez ici. Aucune coupure pendant la lecture.':'Ouvrez la publicité, fermez-la, puis revenez ici pour regarder.';
        }
        async function checkV2() {
            if (!v2Locked || v2Busy || Date.now()>v2Deadline) return;
            v2Busy=true;const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),4000);
            try {
                const statusUrl=new URL(v2Open,location.href);statusUrl.pathname='/api/partner-v2/status';
                const response=await fetch(statusUrl.href,{cache:'no-store',credentials:'omit',signal:abort.signal});
                const progress=response.ok?await response.json():null;
                if(progress?.unlocked===true){
                    v2Locked=false;clearTimeout(v2Poll);v2Gate.remove();userPlayGesture=true;
                    sourceDiscoveryAttempts=0;sourceDiscoveryDeadline=Date.now()+180000;scheduleSourceDiscovery(1000);
                    bootAutoPlayback();return;
                }
                if(progress && [1,2].includes(progress.required) && Number.isInteger(progress.opened) && progress.opened>=0 && progress.opened<=progress.required){
                    v2Opened=progress.opened;v2Required=progress.required;showV2Progress();
                    if(v2Opened>=v2Expected){
                        clearTimeout(v2Poll);v2Deadline=0;v2Button.disabled=false;
                        v2Status.textContent=v2Opened>0?'Première ouverture enregistrée. Cliquez pour ouvrir la dernière publicité.':'Cette publicité aide à financer le lecteur. Aucun temps d’attente imposé.';
                        return;
                    }
                }
            } catch(_) {} finally {clearTimeout(timeout);v2Busy=false;}
            if(v2Locked && Date.now()<v2Deadline)v2Poll=setTimeout(checkV2,1200);
            else if(v2Locked){v2Button.disabled=false;v2Status.textContent='La lecture n’a pas été débloquée. Cliquez sur Lire pour réessayer.';}
        }
        v2Button?.addEventListener('click',()=>{
            const openUrl=new URL(v2Open,location.href);openUrl.searchParams.set('step',String(v2Opened+1));
            const opened=window.open(openUrl.href,'_blank');
            if(!opened){v2Status.textContent='Votre navigateur bloque la publicité. Autorisez son ouverture, puis cliquez sur Lire.';return;}
            try{opened.opener=null;}catch(_){}
            rememberReaderAd();
            v2Expected=v2Opened+1;
            v2Button.disabled=true;v2Status.textContent='Vous pouvez fermer la publicité et revenir ici. Vérification de l’ouverture…';v2Deadline=Date.now()+45000;checkV2();
        });
        document.addEventListener('visibilitychange',()=>{if(!document.hidden&&v2Locked&&v2Deadline>Date.now())checkV2();});
        v2Button.disabled=true;v2Deadline=Date.now()+45000;checkV2();
    } else if (!integrationIssue) {
        bootAutoPlayback();
    }
})();
</script>
